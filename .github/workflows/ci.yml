name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-13, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Compile sources
        run: python -m compileall src tests scripts

      - name: Type check
        run: python -m mypy src tests scripts
