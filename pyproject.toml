[project]
name = "PRL-Today"
version = "0.1.3"
description = "Always-on-top PRL daily mining profit floating window."
requires-python = ">=3.10"
dependencies = ["PyQt5>=5.15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
prl-today = "prl_profit_float.app:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["bandit>=1.7", "mypy>=1.8", "pip-audit>=2.7", "ruff>=0.5"]
test = ["mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prl_profit_float.qt_app"
ignore_errors = true
